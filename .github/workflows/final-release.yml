name: Freeze Experiment 2 release

on:
  push:
    tags:
      - experiment-2-final-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Create private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          for path in \
            archive/experiment-2/outputs/final/REPORT.md \
            archive/experiment-2/artifact_manifest.json
          do
            if [[ -f "$path" ]]; then
              assets+=("$path")
            fi
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Experiment 2: Tulu-3-8B SSP geometry" \
            --generate-notes
